<script>
    // 1. URL DINÂMICA: Detecta se está no Render ou rodando localmente
    const API_URL = window.location.hostname.includes('onrender.com')
        ? `${window.location.origin}/todos`
        : 'http://localhost:8080/todos';

    let produtosLocais = [];

    function checarPermissoes() {
        const role = localStorage.getItem('userRole');
        const authBtn = document.getElementById('authBtn');
        const btnAdminFlutuante = document.getElementById('btnAdminFlutuante');
        const btnBannerFlutuante = document.getElementById('btnBannerFlutuante');
        const abaSacola = document.getElementById('abaSacola');

        if (role) {
            authBtn.innerText = 'Sair';
            btnAdminFlutuante.style.display = (role === 'VENDEDOR') ? 'flex' : 'none';
            btnBannerFlutuante.style.display = (role === 'VENDEDOR') ? 'flex' : 'none';
            abaSacola.style.display = (role === 'CLIENTE') ? 'block' : 'none';
        } else {
            authBtn.innerText = 'Login';
            btnAdminFlutuante.style.display = 'none';
            btnBannerFlutuante.style.display = 'none';
            abaSacola.style.display = 'none';
        }
        atualizarContadorSacola();
    }

    function gerenciarSessao() {
        if (localStorage.getItem('userRole')) {
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            window.location.reload();
        } else {
            window.location.href = 'login.html';
        }
    }

    function toggleAdminModal(show) {
        document.getElementById('adminModal').style.display = show ? 'block' : 'none';
        document.getElementById('overlay').style.display = show ? 'block' : 'none';
    }

    function toggleBannerModal(show) {
        document.getElementById('bannerModal').style.display = show ? 'block' : 'none';
        document.getElementById('overlay').style.display = show ? 'block' : 'none';
    }

    function toggleSacola(show) {
        const drawer = document.getElementById('sacolaDrawer');
        const overlay = document.getElementById('overlay');
        if (show) {
            drawer.classList.add('open');
            overlay.style.display = 'block';
            renderizarSacola();
        } else {
            drawer.classList.remove('open');
            overlay.style.display = 'none';
        }
    }

    function fecharModais() {
        toggleAdminModal(false);
        toggleBannerModal(false);
        toggleSacola(false);
    }

    function rolarParaDestaques() {
        document.getElementById('secaoDestaques').scrollIntoView({ behavior: 'smooth' });
    }

    function obterItensSacola() {
        return JSON.parse(localStorage.getItem('matuta_cart') || '[]');
    }

    function atualizarContadorSacola() {
        const itens = obterItensSacola();
        document.getElementById('sacolaContador').innerText = itens.length;
    }

    function renderizarSacola() {
        const content = document.getElementById('drawerContent');
        const totalText = document.getElementById('sacolaTotal');
        const itens = obterItensSacola();

        content.innerHTML = '';
        if(itens.length === 0) {
            content.innerHTML = '<p style="text-align:center; color:#7a7265; margin-top:40px;">Sua sacola está vazia.</p>';
            totalText.innerText = 'R$ 0,00';
            return;
        }

        let soma = 0;
        itens.forEach((item, index) => {
            soma += item.preco;
            content.innerHTML += `
                <div class="cart-item">
                    <img src="${item.foto}" class="cart-item-img" alt="${item.nome}">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.nome}</div>
                        <div class="cart-item-meta">Tam: ${item.tamanho} | Cor: ${item.cor}</div>
                        <div class="cart-item-price">R$ ${item.preco.toFixed(2)}</div>
                    </div>
                    <button class="btn-remove-item" onclick="removerItemSacola(${index})">Remover</button>
                </div>
            `;
        });
        totalText.innerText = `R$ ${soma.toFixed(2)}`;
    }

    function removerItemSacola(index) {
        let itens = obterItensSacola();
        itens.splice(index, 1);
        localStorage.setItem('matuta_cart', JSON.stringify(itens));
        atualizarContadorSacola();
        renderizarSacola();
    }

    function finalizarCompra() {
        const itens = obterItensSacola();
        if (itens.length === 0) {
            alert('Sua sacola está vazia!');
            return;
        }
        window.location.href = 'checkout.html';
    }

    function aplicarConfiguracoesBannerSalvas() {
        const tituloSalvo = localStorage.getItem('banner_titulo');
        const subSalvo = localStorage.getItem('banner_subtitulo');
        const foto1Salva = localStorage.getItem('banner_foto1');
        const foto2Salva = localStorage.getItem('banner_foto2');

        if(tituloSalvo) document.getElementById('bannerTxtTitulo').innerText = tituloSalvo;
        if(subSalvo) document.getElementById('bannerTxtSub').innerText = subSalvo;
        if(foto1Salva) document.getElementById('bannerImg1').src = foto1Salva;
        if(foto2Salva) document.getElementById('bannerImg2').src = foto2Salva;
    }

    function redimensionarEConverterImagem(file, maxWidth = 1200) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function salvarConfiguracoesBanner() {
        const titulo = document.getElementById('customTitulo').value.trim();
        const subtitulo = document.getElementById('customSubtitulo').value.trim();
        const file1 = document.getElementById('customFile1').files[0];
        const file2 = document.getElementById('customFile2').files[0];

        if(titulo) localStorage.setItem('banner_titulo', titulo);
        if(subtitulo) localStorage.setItem('banner_subtitulo', subtitulo);

        try {
            if (file1) {
                const foto1Base64 = await redimensionarEConverterImagem(file1);
                localStorage.setItem('banner_foto1', foto1Base64);
            }
            if (file2) {
                const foto2Base64 = await redimensionarEConverterImagem(file2);
                localStorage.setItem('banner_foto2', foto2Base64);
            }

            alert('Banner atualizado com sucesso!');
            fecharModais();
            aplicarConfiguracoesBannerSalvas();
        } catch (erro) {
            alert('Erro ao processar imagem do banner.');
            console.error(erro);
        }
    }

    function limparBannerConfig() {
        localStorage.removeItem('banner_titulo');
        localStorage.removeItem('banner_subtitulo');
        localStorage.removeItem('banner_foto1');
        localStorage.removeItem('banner_foto2');
        window.location.reload();
    }

    function passarFotoCard(event, produtoId, direcao) {
        event.preventDefault();
        event.stopPropagation();

        const wrapper = document.getElementById(`wrapper-${produtoId}`);
        const imagens = wrapper.querySelectorAll('img');
        let indexAtivo = 0;

        imagens.forEach((img, index) => {
            if (img.classList.contains('active')) {
                indexAtivo = index;
            }
        });

        imagens[indexAtivo].classList.remove('active');

        let novoIndex = indexAtivo + direcao;
        if (novoIndex >= imagens.length) novoIndex = 0;
        if (novoIndex < 0) novoIndex = imagens.length - 1;

        imagens[novoIndex].classList.add('active');
    }

    async function renderizarVitrine(listaParaExibir) {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = '';
        const produtos = listaParaExibir ? listaParaExibir : produtosLocais;

        if (produtos.length === 0) {
            grid.innerHTML = '<p style="grid-column: span 4; text-align: center; color: #7a7265; padding: 40px 0;">Nenhuma peça encontrada.</p>';
            return;
        }

        produtos.forEach(p => {
            let htmlImagens = '';
            const temImagens = p.imagens || p.images;
            const listaImagens = (temImagens && temImagens.length > 0) ? temImagens : ['https://images.unsplash.com/photo-1434389677669-e08b4cac3105?q=80&w=500'];

            listaImagens.forEach((imgUrl, idx) => {
                htmlImagens += `<img src="${imgUrl}" alt="${p.nome}" class="${idx === 0 ? 'active' : ''}">`;
            });

            let htmlSetas = '';
            if (listaImagens.length > 1) {
                htmlSetas = `
                    <button class="card-arrow card-arrow-left" onclick="passarFotoCard(event, ${p.id}, -1)">&#10094;</button>
                    <button class="card-arrow card-arrow-right" onclick="passarFotoCard(event, ${p.id}, 1)">&#10095;</button>
                `;
            }

            grid.innerHTML += `
                <a href="produto.html?id=${p.id}" class="product-card">
                    <div class="img-wrapper" id="wrapper-${p.id}">
                        ${htmlImagens}
                        ${htmlSetas}
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.nome}</div>
                        <div class="product-details">Tamanho ${p.tamanho} | Cor ${p.cor}</div>
                        <div class="product-price">R$ ${p.preco.toFixed(2)}</div>
                    </div>
                </a>
            `;
        });
    }

    async function carregarDados() {
        try {
            const resposta = await fetch(API_URL);
            const dados = await resposta.json();
            produtosLocais = dados.content ? dados.content : dados;
            renderizarVitrine();
        } catch (erro) {
            console.error('Erro ao carregar os dados da vitrine:', erro);
        }
    }

    function filtrarCategoria(categoriaEnum) {
        document.getElementById('inputBusca').value = '';
        const titulo = document.getElementById('tituloVitrine');

        if (categoriaEnum === 'ALL') {
            titulo.innerText = 'DESTAQUES';
            renderizarVitrine(produtosLocais);
        } else {
            titulo.innerText = categoriaEnum.replace('_', ' ');
            const filtrados = produtosLocais.filter(p => p.categoria === categoriaEnum);
            renderizarVitrine(filtrados);
        }
        rolarParaDestaques();
    }

    document.getElementById('inputBusca').addEventListener('input', (e) => {
        const termoBusca = e.target.value.toLowerCase().trim();
        const produtosFiltrados = produtosLocais.filter(p =>
            p.nome.toLowerCase().includes(termoBusca) ||
            p.cor.toLowerCase().includes(termoBusca)
        );
        renderizarVitrine(produtosFiltrados);
    });

    // 2. FORMULÁRIO DE CADASTRO CORRIGIDO (Trata vírgulas no preço)
    document.getElementById('roupaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('fotoArquivo').files[0];

        // Converte vírgula para ponto caso o usuário digite "109,99"
        const precoBruto = document.getElementById('preco').value.replace(',', '.');
        const precoNumerico = parseFloat(precoBruto);

        if (isNaN(precoNumerico)) {
            alert('Por favor, informe um preço válido.');
            return;
        }

        const roupaData = {
            nome: document.getElementById('nome').value,
            descricao: "Item exclusivo Matuta Boutique.",
            preco: precoNumerico,
            sku: document.getElementById('sku').value,
            qtEstoque: parseInt(document.getElementById('qtEstoque').value),
            tamanho: document.getElementById('tamanho').value,
            categoria: document.getElementById('categoria').value,
            cor: document.getElementById('cor').value,
            imagens: []
        };

        const formData = new FormData();
        formData.append("data", new Blob([JSON.stringify(roupaData)], { type: "application/json" }));

        if (fileInput) {
            formData.append("foto", fileInput);
        }

        try {
            const resposta = await fetch(API_URL, {
                method: 'POST',
                body: formData
            });

            if (resposta.ok) {
                document.getElementById('roupaForm').reset();
                fecharModais();
                carregarDados();
                alert('Produto cadastrado com sucesso!');
            } else {
                const erroTexto = await resposta.text();
                alert('Erro ao salvar: ' + erroTexto);
            }
        } catch (err) {
            console.error(err);
            alert('Erro ao conectar com o servidor. Verifique o console.');
        }
    });

    checarPermissoes();
    carregarDados();
    aplicarConfiguracoesBannerSalvas();
</script>
