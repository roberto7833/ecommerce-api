<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matuta Boutique | Detalhes da Peça</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Didot", "Playfair Display", Arial, sans-serif; }
        body { background-color: #fcfbfa; color: #1c1a17; padding-bottom: 80px; }

        header { background-color: #ffffff; padding: 25px 50px; border-bottom: 1px solid #eae5df; }
        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: auto; }
        .logo { font-size: 28px; letter-spacing: 5px; color: #1c1a17; text-decoration: none; font-family: "Playfair Display", serif; }
        .btn-voltar { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; border: 1px solid #1c1a17; padding: 8px 18px; text-decoration: none; color: #1c1a17; transition: all 0.2s; }
        .btn-voltar:hover { background: #1c1a17; color: #ffffff; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }

        .gallery { display: flex; flex-direction: column; gap: 20px; }
        .main-img-wrapper { width: 100%; aspect-ratio: 3/4; background-color: #f4f0ea; overflow: hidden; position: relative; }
        .main-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .thumbnails { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .thumb-item { position: relative; width: 80px; aspect-ratio: 3/4; cursor: pointer; border: 1px solid transparent; }
        .thumb-item.active { border-color: #1c1a17; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-delete-img { position: absolute; top: 2px; right: 2px; background: rgba(220, 53, 69, 0.9); color: white; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; cursor: pointer; display: none; align-items: center; justify-content: center; }
        .thumb-item:hover .btn-delete-img { display: flex; }

        .product-details { display: flex; flex-direction: column; gap: 20px; }
        .product-title { font-size: 32px; font-weight: 300; letter-spacing: 3px; font-family: "Playfair Display", serif; }
        .product-price { font-size: 22px; color: #1c1a17; margin-bottom: 10px; }

        /* ===================================================================
           ESTILO MINIMALISTA LIMPO (SEM CAIXAS BRANCAS/CINZAS DE INPUT)
           =================================================================== */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7a7265;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 0;
            border: none;
            border-bottom: 1px dotted #eae5df; /* Borda pontilhada discreta */
            background: transparent; /* Fundo transparente */
            font-size: 13px;
            outline: none;
            color: #1c1a17;
            letter-spacing: 0.5px;
            border-radius: 0;
        }

        .form-group select {
            cursor: pointer;
        }

        .btn-action { width: 100%; padding: 16px; background: #1c1a17; color: white; border: none; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; margin-top: 15px; }
        .btn-action:hover { opacity: 0.9; }
        .btn-danger { background: transparent; border: 1px solid #dc3545; color: #dc3545; margin-top: 10px; }
        .btn-danger:hover { background: #dc3545; color: white; }

        .upload-section { margin-top: 25px; padding: 20px; border: 1px dashed #eae5df; background: #ffffff; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; gap: 30px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="logo">MATUTA BOUTIQUE</a>
        <a href="index.html" class="btn-voltar">← Voltar ao Acervo</a>
    </div>
</header>

<main class="container">
    <div class="gallery">
        <div class="main-img-wrapper">
            <img id="fotoPrincipal" src="" alt="Foto do Produto">
        </div>
        <div id="thumbnailsContainer" class="thumbnails"></div>

        <div id="uploadBox" class="upload-section" style="display: none;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Adicionar mais fotos a este produto:</label>
                <input type="file" id="novasFotos" accept="image/*" multiple style="border:none;">
            </div>
        </div>
    </div>

    <div class="product-details">
        <h1 id="exibicaoNome" class="product-title">Carregando...</h1>
        <div id="exibicaoPreco" class="product-price">R$ 0,00</div>

        <form id="detalhesForm">
            <div class="form-group">
                <label>Nome do Produto:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label>Preço (R$):</label>
                <input type="text" id="preco" required>
            </div>

            <div class="form-group">
                <label>Categoria:</label>
                <select id="categoria" required>
                    <option value="NOVA_COLECO">NOVA COLEÇÃO</option>
                    <option value="VESTIDOS">VESTIDOS</option>
                    <option value="MODA_FEMININA">MODA FEMININA</option>
                    <option value="MODA_MASCULINA">MODA MASCULINA</option>
                    <option value="ACESSORIOS">ACESSÓRIOS</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tamanho:</label>
                <select id="tamanho" required>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cor Disponível:</label>
                <input type="text" id="cor" required>
            </div>

            <div class="form-group">
                <label>Estoque Disponível:</label>
                <input type="number" id="qtEstoque" required>
            </div>

            <div id="vendedorActions" style="display: none;">
                <button type="submit" class="btn-action">Salvar Alterações</button>
                <button type="button" class="btn-action btn-danger" onclick="excluirProduto()">Remover do Catálogo</button>
            </div>

            <div id="clienteActions" style="display: none;">
                <button type="button" class="btn-action" onclick="adicionarNaSacola()">Adicionar à Sacola</button>
            </div>
        </form>
    </div>
</main>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const produtoId = urlParams.get('id');

    const BASE_URL = window.location.hostname.includes('onrender.com')
        ? window.location.origin
        : 'http://localhost:8080';

    let produtoAtual = null;
    const role = localStorage.getItem('userRole');

    function configurarInterface() {
        if (role === 'VENDEDOR') {
            document.getElementById('vendedorActions').style.display = 'block';
            document.getElementById('uploadBox').style.display = 'block';
        } else {
            document.getElementById('clienteActions').style.display = 'block';
            document.querySelectorAll('#detalhesForm input, #detalhesForm select').forEach(i => i.disabled = true);
        }
    }

    async function carregarProduto() {
        if (!produtoId) {
            alert('Acesse esta página clicando em um produto da vitrine!');
            window.location.href = 'index.html';
            return;
        }

        try {
            const res = await fetch(`${BASE_URL}/todos/${produtoId}`);
            if (!res.ok) throw new Error('Produto não existe no banco');

            produtoAtual = await res.json();

            document.getElementById('exibicaoNome').innerText = produtoAtual.nome;
            document.getElementById('exibicaoPreco').innerText = `R$ ${parseFloat(produtoAtual.preco).toFixed(2)}`;

            document.getElementById('nome').value = produtoAtual.nome || '';
            document.getElementById('preco').value = produtoAtual.preco || '';
            document.getElementById('categoria').value = produtoAtual.categoria || 'NOVA_COLECO';
            document.getElementById('tamanho').value = produtoAtual.tamanho || 'M';
            document.getElementById('cor').value = produtoAtual.cor || '';
            document.getElementById('qtEstoque').value = produtoAtual.qtEstoque || 0;

            renderizarGaleria();
        } catch (err) {
            console.error(err);
            alert('Não foi possível carregar este produto.');
        }
    }

    function renderizarGaleria() {
        const principal = document.getElementById('fotoPrincipal');
        const thumbs = document.getElementById('thumbnailsContainer');
        thumbs.innerHTML = '';

        const imagens = (produtoAtual.imagens && produtoAtual.imagens.length > 0)
            ? produtoAtual.imagens
            : ['https://images.unsplash.com/photo-1434389677669-e08b4cac3105?q=80&w=500'];

        principal.src = imagens[0];

        imagens.forEach((imgUrl, idx) => {
            thumbs.innerHTML += `
                <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="trocarFotoPrincipal('${imgUrl}', this)">
                    <img src="${imgUrl}" alt="Thumbnail">
                    ${role === 'VENDEDOR' && imagens.length > 1 ? `<button type="button" class="btn-delete-img" onclick="removerFoto(event, '${imgUrl}')">✕</button>` : ''}
                </div>
            `;
        });
    }

    function trocarFotoPrincipal(url, el) {
        document.getElementById('fotoPrincipal').src = url;
        document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    }

    document.getElementById('detalhesForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome').value.trim();
        const precoRaw = document.getElementById('preco').value.toString().replace(',', '.').trim();
        const preco = parseFloat(precoRaw);
        const cor = document.getElementById('cor').value.trim();
        const qtEstoque = parseInt(document.getElementById('qtEstoque').value);

        if (!nome || isNaN(preco) || preco <= 0 || !cor || isNaN(qtEstoque)) {
            alert('Preencha todos os campos com valores válidos antes de salvar.');
            return;
        }

        const dadosAtualizados = {
            ...produtoAtual,
            nome: nome,
            preco: preco,
            categoria: document.getElementById('categoria').value,
            tamanho: document.getElementById('tamanho').value,
            cor: cor,
            qtEstoque: qtEstoque
        };

        const files = document.getElementById('novasFotos').files;
        const formData = new FormData();
        formData.append("data", new Blob([JSON.stringify(dadosAtualizados)], { type: "application/json" }));

        if (files && files.length > 0) {
            for (let i = 0; i < files.length; i++) {
                formData.append("foto", files[i]);
            }
        }

        try {
            const res = await fetch(`${BASE_URL}/todos/${produtoId}`, {
                method: 'PUT',
                body: formData
            });

            if (res.ok) {
                alert('Produto e fotos salvos com sucesso!');
                document.getElementById('novasFotos').value = '';
                carregarProduto();
            } else {
                const erroTxt = await res.text();
                alert('Erro ao atualizar no servidor: ' + erroTxt);
            }
        } catch (err) {
            console.error(err);
            alert('Erro de conexão ao salvar alterações.');
        }
    });

    async function removerFoto(e, imgUrl) {
        e.stopPropagation();
        if (!confirm('Deseja remover esta foto do produto?')) return;

        produtoAtual.imagens = produtoAtual.imagens.filter(img => img !== imgUrl);

        const formData = new FormData();
        formData.append("data", new Blob([JSON.stringify(produtoAtual)], { type: "application/json" }));

        try {
            const res = await fetch(`${BASE_URL}/todos/${produtoId}`, {
                method: 'PUT',
                body: formData
            });

            if (res.ok) {
                carregarProduto();
            } else {
                alert('Erro ao remover imagem.');
            }
        } catch (err) {
            console.error(err);
            alert('Erro ao conectar ao servidor.');
        }
    }

    async function excluirProduto() {
        if (!confirm('Tem certeza que deseja excluir esta peça do catálogo?')) return;

        try {
            const res = await fetch(`${BASE_URL}/todos/${produtoId}`, {
                method: 'DELETE'
            });

            if (res.ok) {
                alert('Produto removido!');
                window.location.href = 'index.html';
            } else {
                alert('Erro ao excluir produto.');
            }
        } catch (err) {
            console.error(err);
            alert('Erro ao conectar ao servidor.');
        }
    }

    function adicionarNaSacola() {
        let cart = JSON.parse(localStorage.getItem('matuta_cart') || '[]');
        cart.push({
            id: produtoAtual.id,
            nome: produtoAtual.nome,
            preco: produtoAtual.preco,
            tamanho: produtoAtual.tamanho,
            cor: produtoAtual.cor,
            foto: (produtoAtual.imagens && produtoAtual.imagens.length > 0) ? produtoAtual.imagens[0] : ''
        });
        localStorage.setItem('matuta_cart', JSON.stringify(cart));
        alert('Produto adicionado à sua sacola!');
        window.location.href = 'index.html';
    }

    configurarInterface();
    carregarProduto();
</script>
</body>
</html>
